name: Build patched openHAB WebUI image

on:
  workflow_dispatch:
  push:
    branches:
      - repeater-cache-fix

permissions:
  contents: read
  packages: write

env:
  OPENHAB_VERSION: 5.2.0
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openhab
  IMAGE_TAG: 5.2.0-webui-repeater-fix

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Main UI bundle
        run: ./mvnw -pl bundles/org.openhab.ui -am -DskipTests package

      - name: Verify bundle exists
        run: test -f "bundles/org.openhab.ui/target/org.openhab.ui-${OPENHAB_VERSION}.jar"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push patched image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/openhab-webui/Dockerfile
          push: true
          build-args: |
            OPENHAB_VERSION=${{ env.OPENHAB_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.OPENHAB_VERSION }}-webui-repeater-fix-${{ github.sha }}
